[font]
normal = { family = "ShureTechMono Nerd Font", style = "Regular" }
size = 16.0

[colors.primary]
background = '#131313'
foreground = '#d3c6aa'

[colors.normal]
black   = '#131313'
red     = '#e67e80'
green   = '#a7c080'
yellow  = '#dbbc7f'
blue    = '#7fbbb3'
magenta = '#d699b6'
cyan    = '#83c092'
white   = '#d3c6aa'

[colors.bright]
black   = '#282828'
red     = '#e67e80'
green   = '#a7c080'
yellow  = '#dbbc7f'
blue    = '#7fbbb3'
magenta = '#d699b6'
cyan    = '#83c092'
white   = '#d3c6aa'

[colors.selection]
background = '#4c3743'
text       = '#d3c6aa'

[colors.search.matches]
background = '#a7c080'
foreground = '#272e33'

[colors.search.focused_match]
background = '#e67e80'
foreground = '#272e33'

[window]
startup_mode = "Maximized"
